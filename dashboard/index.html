<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>raftkv monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0d0a;
    --bg-raised: #0f120d;
    --line: #232a1e;
    --line-dim: #171c14;
    --amber: #ffb000;
    --amber-dim: #8a6000;
    --green: #4d9960;
    --green-dim: #2e5c3a;
    --red: #d9534f;
    --red-dim: #7a3230;
    --text: #c9d1c2;
    --text-dim: #5a6355;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 14px;
    line-height: 1.5;
  }
  body { padding: 28px 32px 60px; position: relative; min-height: 100vh; }

  /* CRT scanline overlay -- subtle, fixed, non-interactive */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.012) 0px,
      rgba(255,255,255,0.012) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index: 10;
  }
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.35) 100%);
    z-index: 11;
  }

  .prompt-line {
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .prompt-line .path { color: var(--green); }
  .prompt-line .cmd { color: var(--text); }

  h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 18px 0 2px;
    color: var(--amber);
    text-shadow: 0 0 8px rgba(255,176,0,0.25);
  }
  .meta {
    color: var(--text-dim);
    font-size: 12px;
    margin-bottom: 28px;
  }
  .cursor {
    display: inline-block;
    width: 7px;
    height: 13px;
    background: var(--green);
    margin-left: 2px;
    vertical-align: -2px;
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .cluster {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    margin-bottom: 32px;
  }
  .node {
    position: relative;
    border: 1px solid var(--line);
    padding: 16px 18px 14px;
    background: var(--bg-raised);
  }
  .node::before, .node::after,
  .node .cnr-tl, .node .cnr-tr, .node .cnr-bl, .node .cnr-br {
    content: "";
    position: absolute;
    width: 9px;
    height: 9px;
    border-color: var(--line);
    border-style: solid;
    border-width: 0;
  }
  .node .cnr-tl { top: -1px; left: -1px; border-top-width: 1px; border-left-width: 1px; }
  .node .cnr-tr { top: -1px; right: -1px; border-top-width: 1px; border-right-width: 1px; }
  .node .cnr-bl { bottom: -1px; left: -1px; border-bottom-width: 1px; border-left-width: 1px; }
  .node .cnr-br { bottom: -1px; right: -1px; border-bottom-width: 1px; border-right-width: 1px; }

  .node.leader { border-color: var(--amber-dim); }
  .node.leader .cnr-tl, .node.leader .cnr-tr,
  .node.leader .cnr-bl, .node.leader .cnr-br { border-color: var(--amber); }
  .node.offline { opacity: 0.5; }

  .node-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px dashed var(--line-dim);
  }
  .node-id { font-weight: 600; font-size: 15px; color: var(--text); }
  .role-tag {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .role-tag.leader { color: var(--amber); text-shadow: 0 0 6px rgba(255,176,0,0.4); }
  .role-tag.follower { color: var(--green); }
  .role-tag.candidate { color: var(--amber-dim); animation: blink 0.6s steps(1) infinite; }
  .role-tag.offline { color: var(--red-dim); }

  .field-row {
    display: flex;
    justify-content: space-between;
    padding: 3px 0;
    font-size: 13px;
  }
  .field-label { color: var(--text-dim); }
  .field-value {
    font-variant-numeric: tabular-nums;
    color: var(--text);
    font-weight: 500;
  }
  .node.offline .field-row { color: var(--red-dim); }
  .offline-msg { color: var(--red-dim); font-size: 13px; padding: 4px 0; }

  .term-panel {
    border: 1px solid var(--line);
    background: var(--bg-raised);
    max-width: 640px;
    padding: 0;
  }
  .term-header {
    padding: 10px 16px;
    border-bottom: 1px solid var(--line-dim);
    color: var(--text-dim);
    font-size: 12px;
    display: flex;
    justify-content: space-between;
  }
  .scrollback {
    padding: 14px 16px;
    min-height: 140px;
    max-height: 260px;
    overflow-y: auto;
    font-size: 13px;
  }
  .scrollback .line { margin-bottom: 6px; white-space: pre-wrap; word-break: break-all; }
  .scrollback .in { color: var(--text-dim); }
  .scrollback .in .arrow { color: var(--green); }
  .scrollback .out.ok { color: var(--green); }
  .scrollback .out.err { color: var(--red); }
  .scrollback .hint { color: var(--text-dim); }

  .input-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid var(--line-dim);
  }
  .input-row .arrow { color: var(--green); }
  .input-row input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
  }
  .input-row input::placeholder { color: var(--text-dim); }

  .footnote {
    margin-top: 22px;
    color: var(--text-dim);
    font-size: 12px;
    max-width: 640px;
  }
  .footnote code { color: var(--green); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// Edit these if your cluster runs on different hosts/ports.
const NODE_ADDRESSES = {
  n1: "localhost:8001",
  n2: "localhost:8002",
  n3: "localhost:8003",
};
const POLL_INTERVAL_MS = 500;

async function fetchState(address) {
  try {
    const res = await fetch(`http://${address}/state`, { signal: AbortSignal.timeout(1000) });
    if (!res.ok) return null;
    return await res.json();
  } catch {
    return null;
  }
}
async function submitWrite(address, command) {
  const res = await fetch(`http://${address}/submit`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(command),
  });
  return res.json();
}
async function fetchValue(address, key) {
  const res = await fetch(`http://${address}/get`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ key }),
  });
  return res.json();
}

function Corners() {
  return (
    <>
      <span className="cnr-tl"></span><span className="cnr-tr"></span>
      <span className="cnr-bl"></span><span className="cnr-br"></span>
    </>
  );
}

function NodeCard({ nodeId, state }) {
  const offline = !state;
  const role = offline ? "offline" : state.role;
  return (
    <div className={`node ${role === "leader" ? "leader" : ""} ${offline ? "offline" : ""}`}>
      <Corners />
      <div className="node-head">
        <span className="node-id">{nodeId}</span>
        <span className={`role-tag ${role}`}>[{role}]</span>
      </div>
      {offline ? (
        <div className="offline-msg">no response from {NODE_ADDRESSES[nodeId]}</div>
      ) : (
        <>
          <div className="field-row"><span className="field-label">term</span><span className="field-value">{state.term}</span></div>
          <div className="field-row"><span className="field-label">leader</span><span className="field-value">{state.leader_id || "—"}</span></div>
          <div className="field-row"><span className="field-label">log_len</span><span className="field-value">{state.log_length}</span></div>
          <div className="field-row"><span className="field-label">commit</span><span className="field-value">{state.commit_index}</span></div>
        </>
      )}
    </div>
  );
}

function Dashboard() {
  const [states, setStates] = useState({});
  const [cmd, setCmd] = useState("");
  const [lines, setLines] = useState([
    { type: "hint", text: "type a command: set <key> <value>  |  get <key>  |  del <key>" },
  ]);
  const scrollRef = useRef(null);
  const lineId = useRef(0);

  useEffect(() => {
    const poll = async () => {
      const entries = await Promise.all(
        Object.entries(NODE_ADDRESSES).map(async ([id, addr]) => [id, await fetchState(addr)])
      );
      setStates(Object.fromEntries(entries));
    };
    poll();
    const interval = setInterval(poll, POLL_INTERVAL_MS);
    return () => clearInterval(interval);
  }, []);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [lines]);

  const push = (type, text) => {
    lineId.current += 1;
    setLines((prev) => [...prev, { id: lineId.current, type, text }]);
  };

  const currentLeader = Object.entries(states).find(([, s]) => s && s.role === "leader");

  const runCommand = async (raw) => {
    const parts = raw.trim().split(/\s+/);
    const op = (parts[0] || "").toLowerCase();
    push("in", raw);

    if (op === "set" && parts.length >= 3) {
      const key = parts[1];
      const value = parts.slice(2).join(" ");
      if (!currentLeader) { push("err", "no leader available -- try again shortly"); return; }
      const [leaderId] = currentLeader;
      const result = await submitWrite(NODE_ADDRESSES[leaderId], { op: "SET", key, value });
      push(result.accepted ? "ok" : "err",
        result.accepted ? `committed via ${leaderId}` : "rejected -- leader may have changed");
    } else if (op === "get" && parts.length === 2) {
      const key = parts[1];
      const leaderAddr = currentLeader ? NODE_ADDRESSES[currentLeader[0]] : null;
      const candidates = leaderAddr
        ? [leaderAddr, ...Object.values(NODE_ADDRESSES).filter((a) => a !== leaderAddr)]
        : Object.values(NODE_ADDRESSES);
      let done = false;
      for (const addr of candidates) {
        try {
          const result = await fetchValue(addr, key);
          push("ok", result.value === null ? "(nil)" : result.value);
          done = true;
          break;
        } catch { /* try next */ }
      }
      if (!done) push("err", "all nodes unreachable");
    } else if (op === "del" && parts.length === 2) {
      const key = parts[1];
      if (!currentLeader) { push("err", "no leader available -- try again shortly"); return; }
      const [leaderId] = currentLeader;
      const result = await submitWrite(NODE_ADDRESSES[leaderId], { op: "DELETE", key });
      push(result.accepted ? "ok" : "err",
        result.accepted ? `deleted via ${leaderId}` : "rejected -- leader may have changed");
    } else {
      push("err", "usage: set <key> <value>  |  get <key>  |  del <key>");
    }
  };

  const handleKeyDown = (e) => {
    if (e.key === "Enter" && cmd.trim()) {
      runCommand(cmd);
      setCmd("");
    }
  };

  return (
    <div>
      <div className="prompt-line">
        <span className="path">root@raftkv</span>:<span>~$</span> <span className="cmd">monitor --nodes 3 --interval 500ms</span>
      </div>
      <h1>raftkv cluster monitor</h1>
      <div className="meta">polling {Object.keys(NODE_ADDRESSES).length} nodes every {POLL_INTERVAL_MS}ms<span className="cursor"></span></div>

      <div className="cluster">
        {Object.keys(NODE_ADDRESSES).map((id) => (
          <NodeCard key={id} nodeId={id} state={states[id]} />
        ))}
      </div>

      <div className="term-panel">
        <div className="term-header">
          <span>session</span>
          <span>{currentLeader ? `leader: ${currentLeader[0]}` : "no leader"}</span>
        </div>
        <div className="scrollback" ref={scrollRef}>
          {lines.map((l, i) => {
            if (l.type === "hint") return <div key={i} className="line hint"># {l.text}</div>;
            if (l.type === "in") return <div key={l.id} className="line in"><span className="arrow">raftkv&gt;</span> {l.text}</div>;
            return <div key={l.id} className={`line out ${l.type}`}>{l.text}</div>;
          })}
        </div>
        <div className="input-row">
          <span className="arrow">raftkv&gt;</span>
          <input
            autoFocus
            value={cmd}
            onChange={(e) => setCmd(e.target.value)}
            onKeyDown={handleKeyDown}
            placeholder="set myname sameer"
          />
        </div>
      </div>

      <div className="footnote">
        node addresses are hardcoded in <code>NODE_ADDRESSES</code> at the top of this file -- edit them if your cluster runs on different ports.
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Dashboard />);
</script>
</body>
</html>
